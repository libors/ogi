<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ogi queue</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #677085; --line: #e2e5eb;
  --accent: #2f6fdf; --ok: #1f8a4c; --warn: #b7791f; --bad: #c53030; --idle: #8a93a6;
  --bar: #e9edf3; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12151b; --panel: #1a1f27; --text: #e3e7ee; --muted: #9aa3b5; --line: #2b313c;
    --accent: #6c9cff; --ok: #4cc27f; --warn: #e0a84a; --bad: #f06a6a; --idle: #7c8598; --bar: #262c37; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
header { display: flex; gap: 16px; align-items: baseline; padding: 12px 20px; border-bottom: 1px solid var(--line);
  background: var(--panel); position: sticky; top: 0; z-index: 3; flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; }
header .meta { color: var(--muted); font-size: 13px; }
main { padding: 12px 20px 40px; max-width: 1600px; margin: 0 auto; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
h2:first-child { margin-top: 4px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.pos { color: var(--ok); } .neg { color: var(--bad); }
.badge { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: 600;
  border: 1px solid currentColor; white-space: nowrap; }
.s-ready, .s-RUNNING, .s-DONE { color: var(--ok); }
.s-connecting, .s-starting, .s-stopping, .s-QUEUED { color: var(--accent); }
.s-backoff, .s-CANCELLED { color: var(--warn); }
.s-FAILED { color: var(--bad); }
.s-offline { color: var(--idle); }

/* Workers */
.workers { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card .name { font-weight: 600; font-size: 15px; }
.slots { display: flex; gap: 3px; margin-top: 8px; flex-wrap: wrap; }
.slot { width: 16px; height: 16px; border-radius: 3px; background: var(--bar); }
.slot.busy { background: var(--accent); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin-top: 8px; font-size: 13px; }
.kv > div:nth-child(odd) { color: var(--muted); }
.err { color: var(--bad); font-size: 12px; margin-top: 6px; word-break: break-word; }
.err.past { color: var(--muted); }
details summary { cursor: pointer; color: var(--muted); }

/* One tab per battle format: its jobs and its battles */
.tabs { display: flex; gap: 4px; margin-top: 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
button.tab { font-size: 14px; padding: 6px 14px; border: 1px solid transparent; border-bottom: none;
  border-radius: 8px 8px 0 0; background: none; color: var(--muted); margin-bottom: -1px; }
button.tab:hover { color: var(--text); border-color: var(--line); }
button.tab.on { color: var(--text); background: var(--panel); border-color: var(--line); font-weight: 600; }
button.tab .tsub { font-size: 12px; font-weight: normal; color: var(--muted); margin-left: 6px; }

/* Jobs left, detail right */
.layout { display: grid; grid-template-columns: minmax(380px, 5fr) 7fr; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }
.list { display: flex; flex-direction: column; gap: 8px; }
.job { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.job:hover { border-color: var(--accent); }
/* The card takes the colour of its result line, lightly. */
.job.r-pos { background: color-mix(in srgb, var(--ok) 9%, var(--panel)); }
.job.r-neg { background: color-mix(in srgb, var(--bad) 9%, var(--panel)); }
.job.r-muted { background: color-mix(in srgb, var(--idle) 11%, var(--panel)); }
.job.selected { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.job .jtop { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.job .jtitle { font-weight: 600; }
.job .jsub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.job .jres { margin-top: 6px; font-weight: 600; }
.job .jfoot { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-top: 6px;
  font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.empty { color: var(--muted); padding: 10px 2px; }
.panel { position: sticky; top: 58px; max-height: calc(100vh - 70px); overflow-y: auto; }
.panel .card + .card, .panel .tablewrap { margin-top: 12px; }
.big { font-size: 18px; font-weight: 700; margin: 6px 0 2px; }
.explain { font-size: 13px; color: var(--muted); margin-top: 4px; }

/* Bars */
.evidence { margin-top: 6px; }
.evidence .labels { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.evidence .track { position: relative; height: 10px; border-radius: 5px; margin-top: 2px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--bad) 35%, var(--bar)), var(--bar) 50%,
    color-mix(in srgb, var(--ok) 35%, var(--bar))); }
.evidence .mid { position: absolute; left: 50%; top: -2px; width: 1px; height: 14px; background: var(--muted); }
.evidence .mark { position: absolute; top: -3px; width: 6px; height: 16px; border-radius: 3px; background: var(--accent);
  transform: translateX(-3px); }
.progress { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; width: 140px; display: inline-block;
  vertical-align: middle; margin-right: 6px; }
.progress div { height: 100%; background: var(--accent); }

/* Tables */
.tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; }
th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
th[title] { cursor: help; text-decoration: underline dotted; }
th.sort { cursor: pointer; }
th.sort:hover { color: var(--text); }
th .arrow { font-size: 10px; margin-left: 3px; }
/* A long table scrolls on its own and keeps its head in view. */
.tablewrap.scroll { max-height: 70vh; overflow: auto; }
.tablewrap.scroll thead th { position: sticky; top: 0; z-index: 1; background: var(--panel); border-bottom: none;
  box-shadow: inset 0 -1px 0 var(--line); }
tr:last-child td { border-bottom: none; }
.list > button.more { align-self: flex-start; padding: 3px 12px; }
button { font: inherit; font-size: 12px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 5px;
  background: var(--panel); color: var(--text); cursor: pointer; }
button:hover { border-color: var(--accent); }
button.danger:hover { border-color: var(--bad); color: var(--bad); }
button:disabled { opacity: .4; cursor: default; }
pre { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px; overflow-x: auto; margin: 6px 0 0; max-height: 300px; }
</style>
</head>
<body>
<header>
  <h1>Ogi queue</h1>
  <span class="meta" id="meta">connecting…</span>
</header>
<main>
  <h2>Workers</h2>
  <div class="workers" id="workers"></div>
  <div class="muted" id="totals" style="font-size:13px; margin-top:8px"></div>
  <nav class="tabs" id="tabs"></nav>

  <div class="layout">
    <div>
      <h2>Running and waiting</h2>
      <div class="list" id="active"></div>
      <h2>Finished</h2>
      <div class="list" id="done"></div>
    </div>
    <div class="panel" id="detail"></div>
  </div>
</main>
<script>
"use strict";
// The job shown on the right: picked by a click (kept in the URL), else the running one.
let selected = (location.hash.match(/job=([\w-]+)/) || [])[1] || null;
// The battle format whose jobs the lists show (kept in the URL); jobs of other formats have tabs of their own.
const FORMATS = ["1v1", "melee", "team"];
let tab = (location.hash.match(/tab=([\w-]+)/) || [])[1] || FORMATS[0];
let lastState = null;
// The job on the right as last fetched, and the one whose page the panel holds now.
let lastJob = null, detailShown = null;
// The finished list shows the last FINISHED_SHOWN jobs until "Show all".
const FINISHED_SHOWN = 20;
let showAllFinished = false;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = (v, d = 2, sign = false) => v == null || isNaN(v) ? "–" : (sign && v > 0 ? "+" : "") + Number(v).toFixed(d);
function dur(ms) {
  if (ms == null || ms < 0) return "–";
  const s = Math.round(ms / 1000);
  if (s < 60) return s + " s";
  if (s < 3600) return Math.floor(s / 60) + " min " + String(s % 60).padStart(2, "0") + " s";
  return Math.floor(s / 3600) + " h " + String(Math.floor(s % 3600 / 60)).padStart(2, "0") + " min";
}
const pad = n => String(n).padStart(2, "0");
/** dd.MM.yyyy HH:mm */
function clock(t) {
  if (!t) return "–";
  const d = new Date(t);
  return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const timeOfDay = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };

/**
 * Makes the children of `el` look like `html` and keeps every node that stays the same. The refresh redraws the
 * page every 2 s this way, so a text selection, a tooltip, a scroll position or a click in progress survives it
 * wherever the content did not change.
 */
function patch(el, html) {
  const t = document.createElement("template");
  t.innerHTML = html;
  patchChildren(el, t.content);
}

function patchChildren(cur, next) {
  const old = [...cur.childNodes], now = [...next.childNodes];
  now.forEach((n, i) => {
    const o = old[i];
    if (!o) cur.appendChild(n);
    else if (o.nodeType !== n.nodeType || o.nodeName !== n.nodeName) cur.replaceChild(n, o);
    else if (o.nodeType !== Node.ELEMENT_NODE) { if (o.nodeValue !== n.nodeValue) o.nodeValue = n.nodeValue; }
    else {
      for (const a of [...o.attributes]) if (!n.hasAttribute(a.name)) o.removeAttribute(a.name);
      for (const a of n.attributes) if (o.getAttribute(a.name) !== a.value) o.setAttribute(a.name, a.value);
      patchChildren(o, n);
    }
  });
  for (let i = old.length - 1; i >= now.length; i--) old[i].remove();
}

/** Folded sections the viewer opened stay open across the refresh. */
function openKeys() {
  return new Set([...document.querySelectorAll("details[data-key]")].filter(d => d.open).map(d => d.dataset.key));
}
const openAttr = (keys, key) => keys.has(key) ? " open" : "";

// ---- Words for the numbers ----

const METRIC = {
  score: "score share",
  hits: "our hit rate",
  dodge: "dodging (100 − their hit rate)",
  recordings: "recordings",
};
const METRIC_HELP = "Score share: our part of both robots' points in a battle, in %. 50 is even, 100 means the "
  + "opponent got nothing. The rumble ranks by its average over opponents (APS).";

/** What the test looks for, in words. */
function testWords(p) {
  if (p.metric === "recordings") return "Recordings for debugging and the benches";
  if (p.bounds === "fixed" && p.draws) return `Fixed ${p.draws} draws of nine opponents, no stopping test`;
  if (p.bounds === "fixed") return `Fixed ${p.pairsPerOpponent ?? ""} pairs per opponent, no stopping test`;
  const d0 = p.delta0, d1 = p.delta1, m = METRIC[p.metric] || p.metric;
  if (p.bounds === "gainer") return `Looking for a gain of ${fmt(d1, 1, true)} ${m} or more`;
  if (p.bounds === "screening") return `Quick look for a big gain (${fmt(d1, 1, true)} ${m})`;
  if (p.bounds === "nonregression") return `Checking that it loses no more than ${fmt(-d0, 2)} ${m}`;
  return d0 == null ? m : `Testing ${fmt(d0, 2, true)} against ${fmt(d1, 2, true)} ${m}`;
}

/** The two answers the test chooses between: [left, right]. */
function answers(p) {
  if (p.bounds === "nonregression") return [`loses ${fmt(-p.delta0, 2)}`, "no loss"];
  if (p.delta0 === 0) return ["no gain", `gain ${fmt(p.delta1, 1, true)}`];
  return [fmt(p.delta0, 2, true), fmt(p.delta1, 2, true)];
}

function opponentsWords(p) {
  if (p.opponentsTitle) return p.opponentsTitle;
  return `${p.opponents ?? "?"} opponents${p.opponentSet ? " (" + p.opponentSet + ")" : ""}`;
}

/** The estimate in words: better or worse when the whole 95 % interval says so. */
function resultWords(p, active) {
  if (p.metric === "recordings") {
    return {text: `${p.pairs ?? 0} of ${p.maxPairs ?? "?"} battles recorded`, cls: ""};
  }
  if (p.estimate == null) return {text: active ? "No pairs yet" : "No result", cls: "muted"};
  const e = p.estimate, h = p.halfWidth;
  const range = `${fmt(e, 2, true)} ± ${fmt(h)}`;
  if (e - h > 0) return {text: `Better by ${range}`, cls: "pos"};
  if (e + h < 0) return {text: `Worse by ${range}`, cls: "neg"};
  return {text: `No clear difference${active ? " yet" : ""}: ${range}`, cls: "muted"};
}

/** How the test ended, in words. */
function verdictWords(j) {
  const p = j.progress || {}, r = j.reason || "";
  if (j.state === "CANCELLED") return "Cancelled before the test decided";
  if (j.state === "FAILED") return "Failed: " + r;
  if (p.metric === "recordings") return r;
  const [no, yes] = answers(p);
  if (r.startsWith("H1")) return `Test: ${yes} (the data is nearer “${yes}” than “${no}”)`;
  if (r.startsWith("H0")) return `Test: ${no} (the data is nearer “${no}” than “${yes}”)`;
  return r ? "Test: " + r : "";
}

function evidenceBar(p) {
  if (p.llr == null || p.lower == null) return "";
  const pos = Math.max(0, Math.min(1, (p.llr - p.lower) / (p.upper - p.lower)));
  const [no, yes] = answers(p);
  return `<div class="evidence" title="How strong the evidence is. The test stops when the marker reaches an end. `
    + `(LLR ${fmt(p.llr)} between ${fmt(p.lower)} and ${fmt(p.upper)})">
      <div class="labels"><span>← ${esc(no)}</span><span>evidence</span><span>${esc(yes)} →</span></div>
      <div class="track"><div class="mid"></div><div class="mark" style="left:${pos * 100}%"></div></div></div>`;
}

/** Battles taken from earlier jobs instead of played (the battle cache). */
function reusedWords(p) {
  return p.reusedBattles ? ` · ${p.reusedBattles} battles reused` : "";
}

function titleOf(j) {
  if (j.note) return j.note;
  const p = j.progress || {};
  return p.candidate ? `Ogi ${p.candidate} against ${p.baseline}` : j.title;
}

// ---- Rendering ----

async function load() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    lastState = await r.json();
    render(lastState);
    const shown = shownJob(lastState);
    if (shown) loadDetail(shown); else {
      detailShown = null;
      patch(document.getElementById("detail"),
        '<div class="card empty">Click a job to see what it compares and how it went.</div>');
    }
  } catch (e) {
    document.getElementById("meta").textContent = "server not reachable – " + e;
  }
}

function shownJob(s) {
  if (selected) return selected;
  const running = s.jobs.find(j => j.state === "RUNNING" && formatOf(j) === tab);
  return running ? running.id : null;
}

const formatOf = j => j.format || FORMATS[0];
const isActive = j => j.state === "QUEUED" || j.state === "RUNNING";

function writeHash() {
  const parts = [];
  if (tab !== FORMATS[0]) parts.push("tab=" + tab);
  if (selected) parts.push("job=" + selected);
  location.hash = parts.join("&");
}

function selectTab(format) {
  if (format === tab) return;
  tab = format;
  if (selected && lastState && !lastState.jobs.some(j => j.id === selected && formatOf(j) === tab)) selected = null;
  writeHash();
  load();
}

/** A tab per format: its battles over all jobs, and its jobs running or waiting. */
function tabs(s) {
  const n = v => Number(v).toLocaleString("en-US");
  const byFormat = new Map(((s.totals || {}).formats || []).map(f => [f.format, f]));
  const known = FORMATS.concat([...byFormat.keys()].filter(f => !FORMATS.includes(f)))
    .concat([...new Set(s.jobs.map(formatOf))].filter(f => !FORMATS.includes(f) && !byFormat.has(f)));
  return known.map(f => {
    const t = byFormat.get(f);
    const active = s.jobs.filter(j => formatOf(j) === f && isActive(j));
    const running = active.filter(j => j.state === "RUNNING").length;
    const waiting = active.length - running;
    const queue = [running ? running + " running" : "", waiting ? waiting + " waiting" : ""].filter(x => x).join(", ");
    const kinds = t ? Object.entries(t.kinds).map(([k, v]) => `${k} ${n(v)}`).join(", ") : "";
    const help = t ? `${n(t.battles)} battles played over all ${f} jobs, ${fmt(t.slotHours, 0)} slot hours (${kinds})`
      : `No ${f} battles played yet`;
    return `<button class="tab${f === tab ? " on" : ""}" title="${esc(help)}" onclick="selectTab('${esc(f)}')">${esc(f)}`
      + `<span class="tsub">${t ? n(t.battles) + " battles" : "no battles"}${queue ? " · " + queue : ""}</span></button>`;
  }).join("");
}

function render(s) {
  const keys = openKeys();
  document.getElementById("meta").textContent = "server up " + dur(s.now - s.startedAt) + " · updated "
    + timeOfDay(s.now);
  patch(document.getElementById("workers"), s.workers.map(w => worker(w, s.now, keys)).join("")
    || '<div class="empty">No workers configured.</div>');
  patch(document.getElementById("totals"), totals(s.totals));
  patch(document.getElementById("tabs"), tabs(s));
  const shown = shownJob(s);
  const jobs = s.jobs.filter(j => formatOf(j) === tab);
  const active = jobs.filter(isActive);
  const done = jobs.filter(j => !isActive(j));
  patch(document.getElementById("active"), active.map((j, i) => jobCard(j, s.now, shown, i, active.length)).join("")
    || `<div class="empty">No ${esc(tab)} job waiting. Submit with ./gradlew submit -Pbaseline=HEAD "-Pnote=what changed"`
      + ` and an opponent set of this format (-Popponents=…).</div>`);
  // The server sends the finished jobs newest first.
  const more = done.length <= FINISHED_SHOWN ? ""
    : `<button class="more" onclick="toggleFinished()">${showAllFinished ? `Show the last ${FINISHED_SHOWN} only`
      : `Show all ${done.length} (${done.length - FINISHED_SHOWN} older)`}</button>`;
  patch(document.getElementById("done"), (showAllFinished ? done : done.slice(0, FINISHED_SHOWN))
    .map(j => jobCard(j, s.now, shown)).join("") + more || `<div class="empty">No finished ${esc(tab)} jobs yet.</div>`);
}

function toggleFinished() {
  showAllFinished = !showAllFinished;
  render(lastState);
}

/** Every battle the workers played to its end over all jobs on disk; cached battles are not played. Per format in the tabs. */
function totals(t) {
  if (!t || !t.battles) return "";
  const n = v => Number(v).toLocaleString("en-US");
  const since = String(t.since).split(" ")[0];
  return `<span title="Battles taken from the cache are not counted: they were played once, by the job that first needed them">All jobs since ${esc(since)}: ${n(t.battles)} battles played, ${fmt(t.slotHours, 0)} slot hours</span>`;
}

function worker(w, now, keys) {
  const i = w.info || {};
  const slots = Array.from({length: w.slots}, (_, k) => `<div class="slot ${k < w.busy ? "busy" : ""}"></div>`).join("");
  const running = (w.running || []).slice(0, 14).map(r => `<div class="mono muted">slot ${r.slot < 0 ? "?" : r.slot} · ${esc(r.battle)} · ${fmt(r.seconds, 0)} s</div>`).join("");
  return `<div class="card">
    <div class="top"><span class="name">${esc(w.name)}</span><span class="badge s-${esc(w.state)}">${esc(w.state)}</span></div>
    <div class="muted" style="font-size:12.5px">${esc(w.detail || (w.local ? "this Mac, trusted robots only" : "foreign robots allowed"))} · since ${dur(now - w.since)}</div>
    <div class="slots" title="Battle slots: blue ones are playing a battle now">${slots}</div>
    <div class="kv">
      <div>Playing</div><div class="num">${w.busy} of ${w.slots} slots</div>
      <div title="Played to their end over all jobs on disk; ${w.battlesThisRun} since the server started">Battles</div><div class="num" title="${w.battlesThisRun} since the server started">${Number(w.battles).toLocaleString("en-US")}${w.battlesPerSecond != null ? " · " + fmt(w.battlesPerSecond) + " per second" : ""}</div>
      ${w.failures || w.restarts ? `<div>Failures · restarts</div><div class="num">${w.failures} · ${w.restarts}</div>` : ""}
    </div>
    ${w.lastError ? errorLine(w, now) : ""}
    <details data-key="worker-${esc(w.name)}"${openAttr(keys, "worker-" + w.name)} style="margin-top:6px">
      <summary>more</summary>
      <div class="kv">
        ${i.cpuConstant ? `<div>CPU constant</div><div class="num">${(i.cpuConstant / 1e6).toFixed(2)} ms (idle ${(i.cpuConstantIdle / 1e6).toFixed(2)} × ${i.cpuFactor})</div>` : ""}
        ${i.java ? `<div>Java</div><div>${esc(i.java)} · sandbox ${i.sandbox ? "on" : "OFF"}</div>` : ""}
        ${i.jvm ? `<div>JVM</div><div class="mono">${esc(i.jvm.join(" "))}</div>` : ""}
      </div>
      ${running ? `<div style="margin-top:6px">${running}</div>` : ""}
    </details>
  </div>`;
}

/** The worker's last error with its time; grey once the worker has run or stopped normally since. */
function errorLine(w, now) {
  const past = ["ready", "stopping", "offline"].includes(w.state)
    && (w.since >= w.lastErrorAt || w.lastOkAt > w.lastErrorAt);
  const when = w.lastErrorAt ? `${timeOfDay(w.lastErrorAt)}, ${dur(now - w.lastErrorAt)} ago` : "";
  return `<div class="err ${past ? "past" : ""}" title="${past ? "Since then the worker has recovered" : ""}">`
    + `${past ? "Last error" : "Error"}${when ? " (" + esc(when) + ")" : ""}: ${esc(w.lastError)}</div>`;
}

function jobCard(j, now, shown, index, count) {
  const p = j.progress || {};
  const active = j.state === "QUEUED" || j.state === "RUNNING";
  const res = resultWords(p, active);
  let foot;
  if (j.state === "RUNNING") {
    const total = p.remainingPairs != null ? p.pairs + p.remainingPairs : p.maxPairs;
    const share = total ? Math.min(1, p.pairs / total) : 0;
    const unit = p.unit || "pairs";
    foot = `<span><span class="progress"><div style="width:${share * 100}%"></div></span>${p.pairs ?? 0} of ~${total ? Math.round(total) : "?"} ${unit}`
      + `${p.etaSeconds != null ? " · about " + dur(p.etaSeconds * 1000) + " left" : ""}${reusedWords(p)}</span>`;
  } else if (j.state === "QUEUED") {
    foot = `<span>waiting ${dur(now - j.submittedAt)}</span>`;
  } else {
    foot = `<span>${clock(j.finishedAt)} · ran ${j.startedAt ? dur(j.finishedAt - j.startedAt) : "–"}`
      + `${p.pairs != null ? " · " + Math.round(p.pairs) + " " + (p.unit || "pairs") : ""}${reusedWords(p)}</span>`;
  }
  const actions = active ? `<span onclick="event.stopPropagation()">
      <button ${index === 0 ? "disabled" : ""} onclick="act('up','${esc(j.id)}')" title="Run earlier">↑</button>
      <button ${index === count - 1 ? "disabled" : ""} onclick="act('down','${esc(j.id)}')" title="Run later">↓</button>
      <button class="danger" onclick="if (confirm('Cancel this job?')) act('cancel','${esc(j.id)}')">cancel</button></span>` : "";
  return `<div class="job ${j.id === shown ? "selected" : ""} ${res.cls ? "r-" + res.cls : ""}" onclick="select('${esc(j.id)}')">
    <div class="jtop"><span class="jtitle">${esc(titleOf(j))}</span><span class="badge s-${j.state}">${j.state.toLowerCase()}</span></div>
    <div class="jsub">${esc(testWords(p))} · ${esc(opponentsWords(p))}</div>
    <div class="jres ${res.cls}">${esc(res.text)}</div>
    ${active ? evidenceBar(p) : `<div class="jsub">${esc(verdictWords(j))}</div>`}
    <div class="jfoot">${foot}${actions}</div>
  </div>`;
}

function select(id) {
  selected = selected === id ? null : id;
  writeHash();
  load();
}

async function loadDetail(id) {
  const r = await fetch("/api/job?id=" + encodeURIComponent(id), {cache: "no-store"});
  if (!r.ok) { document.getElementById("detail").innerHTML = ""; detailShown = null; return; }
  const j = await r.json();
  if (j.id !== shownJob(lastState)) return;
  lastJob = j;
  renderDetail(j);
}

function renderDetail(j) {
  const keys = openKeys();
  const p = j.progress || {};
  const d = j.detail || {};
  const active = j.state === "QUEUED" || j.state === "RUNNING";
  const res = resultWords(p, active);
  const isCompare = p.metric !== "recordings";

  const head = `<div class="card">
    <div class="top"><span class="name">${esc(titleOf(j))}</span><span class="badge s-${j.state}">${j.state.toLowerCase()}</span></div>
    <div class="big ${res.cls}">${esc(res.text)}</div>
    ${isCompare && p.unit === "draws" ? `<div class="explain">Change in ${esc(METRIC[p.metric] || p.metric)} against
      each of a battle's nine opponents, new version minus old, averaged over the draws (both versions meet the same
      field on the same seed); ± is the 95 % interval. Better or worse only when the whole interval says so.</div>`
    : isCompare ? `<div class="explain">Change in ${esc(METRIC[p.metric] || p.metric)}, new version minus old, averaged over
      the opponents; ± is the 95 % interval. Better or worse only when the whole interval says so.</div>` : ""}
    ${active ? evidenceBar(p) : `<div style="margin-top:6px">${esc(verdictWords(j))}</div>`}
    <div class="kv">
      ${isCompare ? `<div>Compares</div><div>new <span class="mono">${esc(p.candidate)}</span> against old <span class="mono">${esc(p.baseline)}</span></div>` : ""}
      <div>Opponents</div><div>${esc(opponentsWords(p))}</div>
      <div>Test</div><div>${esc(testWords(p))}</div>
      ${p.reusedBattles ? `<div>Reused</div><div>${p.reusedBattles} battles came from earlier jobs instead of being played again (counted since the server started; ${p.battles} battles in all)</div>` : ""}
      <div>When</div><div>submitted ${clock(j.submittedAt)}${j.startedAt ? " · started " + clock(j.startedAt) : ""}${j.finishedAt ? " · finished " + clock(j.finishedAt) : ""}</div>
    </div>
  </div>`;

  const boards = (d.scoreboards || []).map(b => {
    const diff = b.difference, h = b.halfWidth;
    const cls = diff - h > 0 ? "pos" : diff + h < 0 ? "neg" : "";
    const text = BOARD_HELP[b.name] || (b.name === "all" && p.unit === "draws" ? MELEE_ALL_HELP : "");
    const help = text ? ` title="${esc(text)}"` : "";
    return `<tr><td${help}>${esc(boardName(b.name))} <span class="muted">(${b.opponents})</span></td>
      <td class="r num">${fmt(b.baseline, 1)}</td><td class="r num">${fmt(b.candidate, 1)}</td>
      <td class="r num ${cls}">${fmt(diff, 2, true)} ± ${fmt(h)}</td>
      <td class="r num">${fmt(b.hitByBaseline, 1)} → ${fmt(b.hitByCandidate, 1)}</td>
      <td class="r num">${fmt(b.hitRateBaseline, 1)} → ${fmt(b.hitRateCandidate, 1)}</td>
      <td class="r num">${fmt(b.pwinBaseline, 0)} → ${fmt(b.pwinCandidate, 0)}</td></tr>`;
  }).join("");
  const boardTable = isCompare ? `<div class="tablewrap"><table>
    <thead><tr><th>Opponents</th>
      <th class="r" title="${esc(METRIC_HELP)} Old version.">Old</th>
      <th class="r" title="The same for the new version.">New</th>
      <th class="r" title="New minus old, averaged over the opponents of the row; ± is the 95 % interval.">Change</th>
      <th class="r" title="How often their bullets hit us, in %, old → new: lower is better movement.">Hit by %</th>
      <th class="r" title="How often our bullets hit them, in %, old → new: higher is a better gun.">Our hits %</th>
      <th class="r" title="Battles won, in %, old → new.">Wins %</th></tr></thead>
    <tbody>${boards || '<tr><td colspan="7" class="empty">no pairs yet</td></tr>'}</tbody></table></div>` : "";

  // A compare job lists its opponents; a recording job gives only their number.
  const rows = sortedOpponents(Array.isArray(d.opponents) ? d.opponents : []).map(o => {
    const cls = o.difference > 0 ? "pos" : o.difference < 0 ? "neg" : "";
    return `<tr><td>${esc(o.opponent)}${o.strong ? ' <span class="muted" title="one of the strong opponents">★</span>' : ""}</td>
      <td class="r num">${o.pairs}</td><td class="r num">${fmt(o.baseline, 1)}</td><td class="r num">${fmt(o.candidate, 1)}</td>
      <td class="r num ${cls}">${fmt(o.difference, 1, true)}</td>
      <td class="r num">${fmt(o.hitByBaseline, 1)} → ${fmt(o.hitByCandidate, 1)}</td>
      <td class="r num">${fmt(o.hitRateBaseline, 1)} → ${fmt(o.hitRateCandidate, 1)}</td></tr>`;
  }).join("");
  const opponentTable = isCompare && rows ? `<div class="card">
    <details data-key="opponents-${esc(j.id)}"${openAttr(keys, "opponents-" + j.id)}>
      <summary>Each opponent, ${esc(OPPONENT_SORTS[opponentSort.key].words[opponentSort.worst ? 0 : 1])}</summary>
      <div class="explain">Click a column's name to sort by it, again to reverse.</div>
      <div class="tablewrap scroll" style="margin-top:8px"><table>
        <thead><tr>${OPPONENT_COLUMNS.map(opponentHead).join("")}</tr></thead>
        <tbody>${rows}</tbody></table></div>
    </details></div>` : "";

  const n = d.noise || {}, h = d.health || {};
  const env = Object.entries(d.environment || {}).map(([k, v]) => `<div>${esc(k)}</div><div class="mono">${esc(v)}</div>`).join("");
  const tech = `<div class="card">
    <details data-key="tech-${esc(j.id)}"${openAttr(keys, "tech-" + j.id)}>
      <summary>Technical details</summary>
      <div class="kv">
        <div>Job</div><div class="mono">${esc(j.id)}</div>
        <div>As submitted</div><div class="mono">${esc(j.title)}</div>
        <div>Decision</div><div>${esc(j.reason || d.decision || "–")}</div>
        ${d.llr != null ? `<div>LLR</div><div class="num">${fmt(d.llr)} between ${fmt(d.llrLower)} and ${fmt(d.llrUpper)}</div>` : ""}
        ${n.sigmaPair != null ? `<div>Noise</div><div class="num">σ per pair ${fmt(n.sigmaPair)} · ρ ${fmt(n.pooledCorrelation)} · expected ${fmt(n.expectedPairsAtBounds, 0)} pairs at the bounds, ${fmt(n.expectedPairsMidway, 0)} midway</div>` : ""}
        ${h.problems != null ? `<div>Health</div><div class="num">skipped turns old ${h.skippedTurnsBaseline}, new ${h.skippedTurnsCandidate}, opponents ${h.skippedTurnsOpponents} · problems ${h.problems} · ${h.battleSeconds} s in battles</div>` : ""}
        ${p.ownTurns ? `<div>Own turns</div><div class="num">${p.ownTurns} reported, longest ${fmt(p.ownTurnMaxMicros / 1000)} ms · over half the idle constant old/new ${p.ownTurnsOverHalfBaseline ?? "–"} / ${p.ownTurnsOverHalfCandidate ?? "–"}</div>` : ""}
        <div>Directory</div><div class="mono">${esc(j.dir)}</div>
        ${env}
      </div>
      ${j.problems && j.problems.length ? `<div class="muted" style="margin-top:8px">Problems (last ${j.problems.length})</div><pre>${esc(j.problems.join("\n"))}</pre>` : ""}
      ${j.dispatch && j.dispatch.length ? `<div class="muted" style="margin-top:8px">Last battles</div><pre>${esc(j.dispatch.slice().reverse().join("\n"))}</pre>` : ""}
      ${d.index && d.index.length ? `<div class="muted" style="margin-top:8px">Last recordings</div><pre>${esc(d.index.slice().reverse().join("\n"))}</pre>` : ""}
    </details></div>`;

  // Another job's page starts at the top of its tables.
  const el = document.getElementById("detail");
  if (detailShown === j.id) patch(el, head + boardTable + opponentTable + tech);
  else el.innerHTML = head + boardTable + opponentTable + tech;
  detailShown = j.id;
}

// ---- The opponent table's order ----

/** The value each column sorts by and its order in words: worst first, then reversed. */
const OPPONENT_SORTS = {
  opponent: {value: o => o.opponent.toLowerCase(), worstFirst: 1, words: ["A to Z", "Z to A"]},
  pairs: {value: o => o.pairs, worstFirst: 1, words: ["fewest pairs first", "most pairs first"]},
  baseline: {value: o => o.baseline, worstFirst: 1, words: ["lowest Old first", "highest Old first"]},
  candidate: {value: o => o.candidate, worstFirst: 1, words: ["lowest New first", "highest New first"]},
  difference: {value: o => o.difference, worstFirst: 1, words: ["worst change first", "best change first"]},
  hitBy: {value: o => o.hitByCandidate, worstFirst: -1, words: ["they hit us most first", "they hit us least first"]},
  hitRate: {value: o => o.hitRateCandidate, worstFirst: 1, words: ["we hit them least first", "we hit them most first"]},
};
const OPPONENT_COLUMNS = [
  {key: "opponent", label: "Opponent"},
  {key: "pairs", label: "Pairs", help: "Pairs of battles played: the old and the new version on the same seed."},
  {key: "baseline", label: "Old", help: METRIC_HELP + " Old version."},
  {key: "candidate", label: "New", help: "The same for the new version."},
  {key: "difference", label: "Change", help: "New minus old. A few pairs per opponent are noisy: ±7 points per pair is normal."},
  {key: "hitBy", label: "Hit by %", help: "How often their bullets hit us, in %, old → new; sorts by new."},
  {key: "hitRate", label: "Our hits %", help: "How often our bullets hit them, in %, old → new; sorts by new."},
];
// Kept across jobs and refreshes.
let opponentSort = {key: "difference", worst: true};

function sortOpponents(key) {
  opponentSort = {key, worst: opponentSort.key === key ? !opponentSort.worst : true};
  if (lastJob) renderDetail(lastJob);
}

/** Opponents without the value (no pairs yet) go last either way; equal values in name order. */
function sortedOpponents(list) {
  const s = OPPONENT_SORTS[opponentSort.key], dir = opponentSort.worst ? s.worstFirst : -s.worstFirst;
  const missing = v => v == null || Number.isNaN(v);
  return list.slice().sort((a, b) => {
    const x = s.value(a), y = s.value(b);
    const order = missing(x) || missing(y) ? missing(x) - missing(y) : x < y ? -dir : x > y ? dir : 0;
    return order || a.opponent.localeCompare(b.opponent);
  });
}

function opponentHead(c) {
  const s = OPPONENT_SORTS[c.key], on = opponentSort.key === c.key;
  const ascending = (opponentSort.worst ? s.worstFirst : -s.worstFirst) > 0;
  return `<th class="sort${c.key === "opponent" ? "" : " r"}" onclick="sortOpponents('${c.key}')"`
    + `${c.help ? ` title="${esc(c.help)}"` : ""}>${esc(c.label)}`
    + `${on ? `<span class="arrow">${ascending ? "▲" : "▼"}</span>` : ""}</th>`;
}

const RUMBLE_HELP = "An estimate for the rumble: every opponent weighs the same within its group, and the groups "
  + "weigh as many robots as they stand for in the rumble (the set's weight lines). The test decides on All.";
const MELEE_ALL_HELP = "The melee rumble's APS estimate of each version: our share of the points against each of a "
  + "battle's nine opponents, averaged over the draws. The draws give every group of the set its share of the "
  + "rumble's participants, so no weights are needed. The test decides on this row.";
const BOARD_HELP = {
  rumble: RUMBLE_HELP,
  survival: "Survival: our first places in % of the rounds, as the melee rumble's second column; the number is the "
    + "draws. The other rows' wins are pairwise: more points than that opponent in the battle.",
};

function boardName(name) {
  if (name === "all") return "All";
  if (name === "rumble") return "Rumble estimate";
  if (name === "strong") return "Strong";
  return name.charAt(0).toUpperCase() + name.slice(1);
}

async function act(action, id) {
  await fetch(`/api/action?action=${action}&id=${encodeURIComponent(id)}`, {method: "POST", headers: {"X-Requested-With": "ogi"}});
  load();
}

load();
setInterval(load, 2000);
</script>
